name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHub web arayüzünden tek tıkla elle başlatabilmek için

jobs:
  build-ios:
    name: Build iOS Application
    runs-on: macos-14 # GitHub'ın ücretsiz sağladığı Apple Silicon Mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 salon_ios.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: salon-ios-app
          path: salon_ios.ipa
          retention-days: 14
